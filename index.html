<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter AI Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Floating Button */
    #floating-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background-color: #2a2a2a;
      border: 3px solid #00e5ff;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
      cursor: grab;
      z-index: 1000;
      user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.1s ease;
    }

    #floating-btn:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(0.95);
    }

    #floating-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Bottom Sheet Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1001;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 600px;
      margin: 0 auto;
      background: #1e1e1e;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
      z-index: 1002;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      max-height: 85vh;
      border-top: 1px solid #333;
    }

    .bottom-sheet.active {
      transform: translateY(0);
    }

    .sheet-header {
      padding: 16px 20px;
      border-bottom: 1px solid #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #00e5ff;
    }

    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0 8px;
    }

    .close-btn:hover {
      color: #fff;
    }

    .sheet-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    /* Views */
    .view {
      display: none;
    }

    .view.active {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Forms */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: #aaa;
    }

    .input-group input {
      background: #121212;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #00e5ff;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #aaa;
      cursor: pointer;
    }

    .checkbox-group input {
      accent-color: #00e5ff;
      width: 16px;
      height: 16px;
    }

    .btn-start {
      background: linear-gradient(135deg, #00e5ff, #0088ff);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s, transform 0.1s;
      display: none;
      margin-top: 8px;
    }

    .btn-start.visible {
      display: block;
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    /* Chat View */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 50vh;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
      margin-bottom: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #0088ff;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 2px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      background: #121212;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #00e5ff;
    }

    .btn-send {
      background: #00e5ff;
      color: #000;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-send:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .btn-text {
      background: none;
      border: none;
      color: #888;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .btn-text:hover {
      color: #ff5252;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #00e5ff;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Nút Tròn Kéo Thả -->
  <div id="floating-btn">
    <img src="https://lh3.googleusercontent.com/gg/AAY1aEikzQ1BllfIu-C2j0g80xV_5v8j-P8x1H3T0284d7a" alt="Robot AI">
  </div>

  <!-- Overlay & Bottom Sheet Modal -->
  <div class="modal-overlay" id="modal-overlay"></div>
  
  <div class="bottom-sheet" id="bottom-sheet">
    <div class="sheet-header">
      <span class="sheet-title" id="sheet-title">Cấu hình OpenRouter</span>
      <button class="close-btn" id="close-btn">&times;</button>
    </div>
    
    <div class="sheet-body">
      <!-- VIEW 1: CẤU HÌNH -->
      <div class="view active" id="config-view">
        <div class="input-group">
          <label for="api-key">OpenRouter API Key</label>
          <input type="password" id="api-key" placeholder="sk-or-v1-..." value="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">
        </div>

        <div class="input-group">
          <label for="model-name">Model AI</label>
          <input type="text" id="model-name" placeholder="openai/gpt-4o" value="openai/gpt-6-astra">
        </div>

        <label class="checkbox-group">
          <input type="checkbox" id="save-config" checked>
          <span>Lưu cấu hình cho lần sau</span>
        </label>

        <button class="btn-start" id="start-btn">Start</button>

        <div class="action-row">
          <button class="btn-text" id="clear-config-btn">Xóa cấu hình đã lưu</button>
        </div>
      </div>

      <!-- VIEW 2: TRÒ CHUYỆN -->
      <div class="view" id="chat-view">
        <div class="action-row" style="margin-top: 0; margin-bottom: 8px;">
          <button class="settings-btn" id="back-to-config">⚙️ Đổi API / Model</button>
          <button class="btn-text" id="clear-chat-btn">Xóa lịch sử chat</button>
        </div>

        <div class="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
          
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button class="btn-send" id="send-btn">Gửi</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // State management
    const STORAGE_KEY_CONFIG = 'openrouter_config';
    const STORAGE_KEY_CHAT = 'openrouter_chat_history';

    let chatHistory = [];

    // Elements
    const floatingBtn = document.getElementById('floating-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const bottomSheet = document.getElementById('bottom-sheet');
    const closeBtn = document.getElementById('close-btn');
    
    const configView = document.getElementById('config-view');
    const chatView = document.getElementById('chat-view');
    const sheetTitle = document.getElementById('sheet-title');

    const apiKeyInput = document.getElementById('api-key');
    const modelInput = document.getElementById('model-name');
    const saveConfigCb = document.getElementById('save-config');
    const startBtn = document.getElementById('start-btn');
    const clearConfigBtn = document.getElementById('clear-config-btn');

    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const backToConfigBtn = document.getElementById('back-to-config');
    const clearChatBtn = document.getElementById('clear-chat-btn');

    // Load saved data on boot
    window.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      loadChatHistory();
      validateInputs();
    });

    // --- DRAGGABLE BUTTON LOGIC ---
    let isDragging = false;
    let hasDragged = false;
    let startX, startY;
    let initialLeft, initialTop;

    const onPointerDown = (e) => {
      isDragging = true;
      hasDragged = false;
      
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      startX = clientX;
      startY = clientY;

      const rect = floatingBtn.getBoundingClientRect();
      initialLeft = rect.left + rect.width / 2;
      initialTop = rect.top + rect.height / 2;
    };

    const onPointerMove = (e) => {
      if (!isDragging) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const deltaX = clientX - startX;
      const deltaY = clientY - startY;

      if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
        hasDragged = true;
      }

      let newLeft = initialLeft + deltaX;
      let newTop = initialTop + deltaY;

      // Keep inside screen viewport
      const radius = 35;
      newLeft = Math.max(radius, Math.min(window.innerWidth - radius, newLeft));
      newTop = Math.max(radius, Math.min(window.innerHeight - radius, newTop));

      floatingBtn.style.left = `${newLeft}px`;
      floatingBtn.style.top = `${newTop}px`;
      floatingBtn.style.transform = 'translate(-50%, -50%)';
    };

    const onPointerUp = () => {
      isDragging = false;
    };

    floatingBtn.addEventListener('mousedown', onPointerDown);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);

    floatingBtn.addEventListener('touchstart', onPointerDown, { passive: true });
    document.addEventListener('touchmove', onPointerMove, { passive: true });
    document.addEventListener('touchend', onPointerUp);

    // Click logic (only open if not dragged)
    floatingBtn.addEventListener('click', () => {
      if (!hasDragged) {
        openModal();
      }
    });

    // --- MODAL LOGIC ---
    function openModal() {
      modalOverlay.classList.add('active');
      bottomSheet.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      bottomSheet.classList.remove('active');
    }

    closeBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', closeModal);

    // --- VALIDATION & FORM ---
    function validateInputs() {
      const key = apiKeyInput.value.trim();
      const model = modelInput.value.trim();

      // Basic validation check
      if (key.length > 5 && model.length > 2) {
        startBtn.classList.add('visible');
      } else {
        startBtn.classList.remove('visible');
      }
    }

    apiKeyInput.addEventListener('input', validateInputs);
    modelInput.addEventListener('input', validateInputs);

    // Save/Load Config
    function saveConfig() {
      if (saveConfigCb.checked) {
        const config = {
          apiKey: apiKeyInput.value.trim(),
          model: modelInput.value.trim()
        };
        localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(config));
      }
    }

    function loadConfig() {
      const saved = localStorage.getItem(STORAGE_KEY_CONFIG);
      if (saved) {
        try {
          const config = JSON.parse(saved);
          if (config.apiKey) apiKeyInput.value = config.apiKey;
          if (config.model) modelInput.value = config.model;
        } catch(e) {}
      }
    }

    clearConfigBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY_CONFIG);
      apiKeyInput.value = '';
      modelInput.value = '';
      validateInputs();
    });

    // --- VIEW SWITCHING ---
    startBtn.addEventListener('click', () => {
      saveConfig();
      switchView('chat');
    });

    backToConfigBtn.addEventListener('click', () => {
      switchView('config');
    });

    function switchView(viewName) {
      if (viewName === 'chat') {
        configView.classList.remove('active');
        chatView.classList.add('active');
        sheetTitle.textContent = `Chat (${modelInput.value.trim()})`;
        renderMessages();
      } else {
        chatView.classList.remove('active');
        configView.classList.add('active');
        sheetTitle.textContent = 'Cấu hình OpenRouter';
      }
    }

    // --- CHAT SYSTEM ---
    function loadChatHistory() {
      const saved = localStorage.getItem(STORAGE_KEY_CHAT);
      if (saved) {
        try {
          chatHistory = JSON.parse(saved);
        } catch(e) {
          chatHistory = [];
        }
      }
    }

    function saveChatHistory() {
      localStorage.setItem(STORAGE_KEY_CHAT, JSON.stringify(chatHistory));
    }

    clearChatBtn.addEventListener('click', () => {
      chatHistory = [];
      saveChatHistory();
      renderMessages();
    });

    function renderMessages() {
      chatMessages.innerHTML = '';
      chatHistory.forEach(msg => {
        const div = document.createElement('div');
        div.className = `message ${msg.role}`;
        div.textContent = msg.content;
        chatMessages.appendChild(div);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      const apiKey = apiKeyInput.value.trim();
      const model = modelInput.value.trim();

      // Add User Message
      chatHistory.push({ role: 'user', content: text });
      chatInput.value = '';
      renderMessages();
      saveChatHistory();

      // UI State: Loading
      sendBtn.disabled = true;
      sendBtn.textContent = '...';

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: chatHistory.map(m => ({ role: m.role, content: m.content }))
          })
        });

        if (!response.ok) {
          throw new Error(`Error: ${response.status}`);
        }

        const data = await response.json();
        const reply = data.choices[0]?.message?.content || 'Không nhận được phản hồi.';
        
        chatHistory.push({ role: 'assistant', content: reply });
        saveChatHistory();
      } catch (err) {
        chatHistory.push({ role: 'assistant', content: `[Lỗi]: ${err.message}` });
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Gửi';
        renderMessages();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
